[project]
name = "ai-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.9.0",
    "groq>=1.7.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true
